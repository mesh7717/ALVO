<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Laptops | Premium Tech Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="navbar container">
            <div class="logo">
                <h2>ByteCraft<span>Laptops</span></h2>
            </div>
            <nav>
                <a href="#home">Home</a>
                <a href="#products">Store</a>
                <div class="cart-icon" id="cart-icon-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count">0</span>
                </div>
            </nav>
        </div>
    </header>

    <section id="home" class="hero">
        <div class="hero-content container">
            <h1>Upgrade Your Performance</h1>
            <p>Discover high-performance laptops built for coding, gaming, and business operations.</p>
            <a href="#products" class="btn">Shop Now</a>
        </div>
    </section>

    <section id="products" class="products container">
        <h2 class="section-title">Featured Models</h2>
        <div class="product-grid" id="product-grid">
            </div>
    </section>

    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <i class="fas fa-times" id="close-cart"></i>
        </div>
        <div class="cart-items" id="cart-items">
            <p class="empty-msg">Your cart is empty.</p>
        </div>
        <div class="cart-footer">
            <div class="total-container">
                <span>Total:</span>
                <span id="cart-total">Ksh 0</span>
            </div>
            <button class="checkout-btn" id="checkout-btn">Proceed to Checkout</button>
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <footer>
        <p>&copy; 2026 ByteCraft Laptops. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
